name: update
on:
  schedule:
    - cron: "17 22 * * *"   # 毎日 7:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fetch.py", "build.py", "template.html", ".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python fetch.py
      - run: if [ -f build.py ]; then python build.py; fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "data: 自動更新" && git pull --rebase && git push)
